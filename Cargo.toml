[package]
name = "iz80"
version = "0.5.1"
authors = ["Ivan Izaguirre <ivanizag@gmail.com>", "TNTSuperMan"]
edition = "2021"
license = "BSD-3-Clause"
description = "Z80 emulator"
keywords = ["Z80", "CPM", "emulator"]
repository = "https://github.com/TNTSuperMan/iz80"
readme = "README.md"

[features]
default = ["disasm"]
disasm = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
